<meta charset="utf-8">
<title>Meridian ITSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..48,500;12..48,600;12..48,700;12..48,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F3F5F6;
  --surface:#FFFFFF;
  --surface-2:#F8FAFA;
  --raised:#FFFFFF;
  --border:#E3E8E8;
  --border-strong:#CFD8D7;
  --text:#151E1D;
  --text-2:#556361;
  --text-3:#8A9694;
  --accent:#0E7C86;
  --accent-ink:#0A5A62;
  --accent-wash:#E1F1F2;
  --ok:#1C8F4E;    --ok-wash:#E1F3E9;
  --warn:#B0740B;  --warn-wash:#F9EFDA;
  --crit:#CE3B34;  --crit-wash:#FBE6E5;
  --info:#3A6EA5;  --info-wash:#E7EFF7;
  --p1:#CE3B34; --p2:#DD741C; --p3:#B0900B; --p4:#7A8785;
  --shadow-sm:0 1px 2px rgba(20,30,29,.05);
  --shadow:0 1px 2px rgba(20,30,29,.06), 0 10px 26px -14px rgba(20,30,29,.20);
  --shadow-lg:0 26px 64px -20px rgba(20,30,29,.34);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --rail-w:248px;
  --radius:11px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1211; --surface:#131A19; --surface-2:#101615; --raised:#182120;
    --border:#242F2D; --border-strong:#33413F;
    --text:#E6EBEA; --text-2:#98A5A3; --text-3:#66726F;
    --accent:#38B4BE; --accent-ink:#8AD6DC; --accent-wash:#122B2E;
    --ok:#40C579; --ok-wash:#11281C; --warn:#E0A63E; --warn-wash:#2C2411;
    --crit:#F06A63; --crit-wash:#301715; --info:#6FA0D6; --info-wash:#16202C;
    --p1:#F06A63; --p2:#EC9046; --p3:#DCB63E; --p4:#8A9694;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.66);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,.72);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1211; --surface:#131A19; --surface-2:#101615; --raised:#182120;
  --border:#242F2D; --border-strong:#33413F;
  --text:#E6EBEA; --text-2:#98A5A3; --text-3:#66726F;
  --accent:#38B4BE; --accent-ink:#8AD6DC; --accent-wash:#122B2E;
  --ok:#40C579; --ok-wash:#11281C; --warn:#E0A63E; --warn-wash:#2C2411;
  --crit:#F06A63; --crit-wash:#301715; --info:#6FA0D6; --info-wash:#16202C;
  --p1:#F06A63; --p2:#EC9046; --p3:#DCB63E; --p4:#8A9694;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.66);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,.72);
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
::selection{background:var(--accent-wash)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}
.rail{background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand .glyph{width:30px;height:30px;flex:none;color:var(--accent)}
.brand .glyph svg{width:100%;height:100%;display:block}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:block}
.brand span{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;padding:4px 12px 14px}
.nav-group{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:14px 10px 5px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:13px;text-align:left;transition:background .12s,color .12s}
.nav button .ico{width:16px;height:16px;flex:none;opacity:.9}
.nav button .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button:hover{background:var(--border);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.nav button .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.nav button[aria-current="page"] .n{color:var(--accent-ink)}
.nav button .n.alert{background:var(--crit);color:#fff;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}

.stage{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 24px;height:56px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar h1{font-size:16px;font-weight:700}
.topbar .search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 10px}
.topbar .search svg{width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:1.8;flex:none}
.topbar .search input{border:none;outline:none;background:none;width:100%;font-size:12.5px}
.topbar .spacer{flex:1}
.topbar .clock{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.btn{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border-strong);color:var(--text-2);transition:.12s;white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border);color:var(--text-2);background:var(--surface)}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

.view{padding:22px 24px 60px;display:none;animation:rise .24s ease}
.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view,.drawer{animation:none!important;transition:none!important}}

.sec{display:flex;align-items:baseline;gap:11px;margin:28px 0 13px;flex-wrap:wrap}
.sec:first-child{margin-top:2px}
.sec h2{font-size:14.5px;font-weight:700}
.sec .hint{font-size:12px;color:var(--text-3)}
.sec .hint b{color:var(--text-2);font-weight:600}
.sec .right{margin-left:auto;display:flex;gap:7px}

/* ============ TILES ============ */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tiles.six{grid-template-columns:repeat(6,1fr)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:3px}
.tile .lab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.tile .big{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.tile .big small{font-size:14px;color:var(--text-3);font-weight:600}
.tile .sub{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.tile .sub .tick{width:6px;height:6px;border-radius:999px;flex:none}

/* ============ PANEL ============ */
.grid-2{display:grid;grid-template-columns:1.3fr .7fr;gap:15px;align-items:start}
.grid-2.even{grid-template-columns:1fr 1fr}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border)}
.panel-head h3{font-size:12.5px;font-weight:700}
.panel-head .c{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.panel-body{padding:6px}
.panel-body.pad{padding:15px}

/* ============ PILLS ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:999px;background:currentColor}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.crit{background:var(--crit-wash);color:var(--crit)}
.pill.info{background:var(--info-wash);color:var(--info)}
.pill.accent{background:var(--accent-wash);color:var(--accent-ink)}
.pill.neutral{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)}
.pri{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap}
.pri::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc)}
.pri.p1{--pc:var(--p1);color:var(--p1)} .pri.p2{--pc:var(--p2);color:var(--p2)}
.pri.p3{--pc:var(--p3);color:var(--text-2)} .pri.p4{--pc:var(--p4);color:var(--text-3)}
.sla{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.sla.ok{background:var(--ok-wash);color:var(--ok)}
.sla.risk{background:var(--warn-wash);color:var(--warn)}
.sla.breach{background:var(--crit-wash);color:var(--crit)}
.sla.met{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)}
.tag{font-family:var(--mono);font-size:10px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap}

/* ============ TABLE ============ */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.tbl-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl-wrap .tbl{min-width:820px}
.panel .tbl{min-width:0}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .t-id{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.tbl .t-sub{font-weight:600;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .t-dim{color:var(--text-2)}
.tbl .t-mono{font-family:var(--mono);font-size:11px;color:var(--text-2)}
.ava{width:22px;height:22px;border-radius:6px;flex:none;display:inline-grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:9px;color:#fff;background:var(--accent)}
.ava.g1{background:linear-gradient(135deg,#0E7C86,#3A6EA5)} .ava.g2{background:linear-gradient(135deg,#1C8F4E,#0E7C86)}
.ava.g3{background:linear-gradient(135deg,#B0740B,#CE3B34)} .ava.g4{background:linear-gradient(135deg,#3A6EA5,#6A4CA5)}
.ava.g5{background:linear-gradient(135deg,#CE3B34,#DD741C)} .ava.unassigned{background:var(--surface-2);color:var(--text-3);border:1px dashed var(--border-strong)}
.who{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* ============ FILTER BAR ============ */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.fbar select,.fbar .fsearch{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--text-2)}
.fbar .fsearch{min-width:180px}
.fbar .fcount{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.chip-toggle{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px}
.chip-toggle button{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;color:var(--text-3)}
.chip-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* ============ CHARTS ============ */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:12px}
.bar-row .bl{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar-row .bv{font-family:var(--mono);font-size:11px;color:var(--text);text-align:right}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:104px;height:104px;flex:none}
.donut .legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
.donut .legend span{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.donut .legend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--lc)}
.donut .legend b{margin-left:auto;font-family:var(--mono);color:var(--text)}
.spark{width:100%;height:40px;display:block}
.aging{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--border);border-radius:9px;overflow:hidden}
.aging div{background:var(--surface);padding:11px 12px;text-align:center}
.aging .av{font-family:var(--display);font-size:20px;font-weight:700}
.aging .al{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-top:2px}

/* ============ MAJOR INCIDENT ============ */
.mi-banner{background:var(--crit-wash);border:1px solid color-mix(in srgb,var(--crit) 40%,transparent);border-radius:var(--radius);padding:13px 15px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mi-banner .mi-dot{width:9px;height:9px;border-radius:999px;background:var(--crit);flex:none;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mi-banner b{font-weight:700}
.mi-banner .mi-meta{font-family:var(--mono);font-size:11px;color:var(--text-2)}

/* ============ CATALOG ============ */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cat-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:15px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:.12s}
.cat-item:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.cat-item .ci-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-wash);color:var(--accent-ink);display:grid;place-items:center}
.cat-item .ci-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.cat-item .ci-name{font-weight:700;font-size:13px}
.cat-item .ci-desc{font-size:11.5px;color:var(--text-2);line-height:1.45}
.cat-item .ci-foot{margin-top:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);display:flex;gap:8px}

/* ============ KB ============ */
.kb-list{display:flex;flex-direction:column;gap:9px}
.kb-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px 15px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.kb-item:hover{border-color:var(--border-strong)}
.kb-item .kb-t{font-weight:700;font-size:13px}
.kb-item .kb-x{font-size:11.5px;color:var(--text-2);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kb-item .kb-m{font-family:var(--mono);font-size:10px;color:var(--text-3);display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.prose{font-size:13px;line-height:1.65;color:var(--text-2)}
.prose h5{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text);margin:16px 0 6px}
.prose p{margin:0 0 9px}
.prose ol,.prose ul{margin:0 0 9px;padding-left:20px}
.prose li{margin-bottom:4px}
.prose code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 4px}

/* ============ CMDB ============ */
.ci-map{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:6px 0}
.ci-col{display:flex;flex-direction:column;gap:7px}
.ci-col .cl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.ci-node{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:11.5px;font-weight:600}
.ci-node.center{background:var(--accent-wash);border-color:transparent;color:var(--accent-ink);text-align:center;padding:11px}
.ci-arrow{color:var(--text-3);font-size:16px}

/* ============ CHANGE CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{background:var(--surface);border:1px solid var(--border);border-radius:9px;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:5px}
.cal-day.today{border-color:var(--accent)}
.cal-day .cd-h{font-family:var(--mono);font-size:10px;color:var(--text-3);display:flex;justify-content:space-between}
.cal-ev{border-radius:6px;padding:5px 7px;font-size:10.5px;line-height:1.3;border-left:3px solid var(--ec);background:var(--surface-2)}
.cal-ev .ce-t{font-family:var(--mono);color:var(--text-3);font-size:9px}
.cal-ev b{font-weight:600;display:block}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:11px}
.matrix .mh{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);display:grid;place-items:center;padding:5px}
.matrix .mc{border-radius:7px;padding:10px 8px;text-align:center;font-family:var(--mono);font-weight:600;font-size:13px}
.matrix .mc.lo{background:var(--ok-wash);color:var(--ok)}
.matrix .mc.md{background:var(--warn-wash);color:var(--warn)}
.matrix .mc.hi{background:var(--crit-wash);color:var(--crit)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(8,14,13,.44);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.15,1);z-index:41;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 13px;border-bottom:1px solid var(--border)}
.dr-head .dr-id{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.dr-head h2{font-size:15.5px;font-weight:700;margin-top:3px}
.dr-close{margin-left:auto;flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);border:1px solid var(--border)}
.dr-close:hover{color:var(--text);border-color:var(--border-strong)}
.dr-close svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}
.dr-body{padding:16px 20px 44px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.dr-pills{display:flex;gap:6px;flex-wrap:wrap}
.dr-sec h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.dr-sec p{font-size:12.5px;color:var(--text-2);line-height:1.6}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);padding-top:1px}
.kv dd{color:var(--text);font-weight:500}
.sla-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sla-card{border:1px solid var(--border);border-radius:9px;padding:11px}
.sla-card .sc-l{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.sla-card .sc-v{font-family:var(--display);font-size:18px;font-weight:700;margin-top:3px}
.sla-card .sc-bar{height:5px;border-radius:999px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.sla-card .sc-bar i{display:block;height:100%;border-radius:999px}
.worklog{display:flex;flex-direction:column;gap:11px}
.wl{display:grid;grid-template-columns:24px 1fr;gap:10px}
.wl .wl-a{width:24px;height:24px;border-radius:6px;font-size:9px}
.wl .wl-b{font-size:12px;color:var(--text-2);line-height:1.5}
.wl .wl-h{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.wl .wl-h b{font-size:11.5px;color:var(--text);font-weight:600}
.wl .wl-h .wl-t{font-family:var(--mono);font-size:9.5px;color:var(--text-3)}
.wl.note .wl-b{background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:8px;padding:8px 10px}
.wl.note .wl-h .wl-tag{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);background:var(--surface);border-radius:4px;padding:1px 4px}
.replybox{border:1px solid var(--border);border-radius:9px;overflow:hidden}
.replybox textarea{width:100%;border:none;outline:none;background:var(--surface);padding:10px;font-size:12.5px;resize:vertical;min-height:56px;font-family:var(--sans)}
.replybox .rb-foot{display:flex;align-items:center;gap:8px;padding:7px 9px;border-top:1px solid var(--border);background:var(--surface-2)}
.linkchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:7px;border:1px solid var(--border);color:var(--text-2)}
.linkchip:hover{border-color:var(--border-strong);color:var(--text)}
.dr-actions{display:flex;gap:7px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:var(--sans)}

/* ============ TOAST ============ */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);font-size:12px;font-weight:500;padding:9px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-family:var(--mono)}

/* ============ RESPONSIVE ============ */
@media (max-width:1120px){ .grid-2,.grid-2.even{grid-template-columns:1fr} .tiles{grid-template-columns:repeat(2,1fr)} .tiles.six{grid-template-columns:repeat(3,1fr)} }
@media (max-width:920px){

  .brand,.nav-group{display:none}

  .nav button{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 9px;min-width:58px;align-items:center;white-space:nowrap;position:relative}

  .stage{padding-bottom:70px}

  .topbar{padding:0 14px;gap:9px}
  .topbar .search{max-width:none}
}

const KB = [
  {id:"KB-014", cat:"Connectivity", title:"VPN error 720 — reset WAN miniport adapters", views:412, helpful:38, updated:"6d ago", tickets:9,
    body:`<p>Error 720 means Windows failed to negotiate the VPN protocol, usually because the WAN Miniport adapters are in a bad state after a client upgrade.</p><h5>Fix</h5><ol><li>Open <b>Device Manager</b> → <b>Network adapters</b>.</li><li>Enable <b>Show hidden devices</b> from the View menu.</li><li>Uninstall every <code>WAN Miniport (IP)</code>, <code>(IPv6)</code>, and <code>(Network Monitor)</code> entry.</li><li>From the Action menu, choose <b>Scan for hardware changes</b> — Windows recreates them.</li><li>Reboot and reconnect the VPN.</li></ol><h5>If it still fails</h5><p>Run <code>netcfg -s n</code> and confirm <code>ms_ndiswanip</code> is listed. If not, contact the Service Desk and reference this article.</p>`},
  {id:"KB-002", cat:"Accounts", title:"Reset your own password (self-service)", views:2140, helpful:190, updated:"1mo ago", tickets:0,
    body:`<p>You can reset a forgotten password without contacting the Service Desk, as long as you have previously registered for self-service reset.</p><h5>Steps</h5><ol><li>Go to <code>https://passwordreset.northwind.example</code>.</li><li>Enter your work email and complete the CAPTCHA.</li><li>Verify with your registered method (authenticator, SMS, or security questions).</li><li>Set a new password meeting the complexity policy (14+ chars, not a previous 10).</li></ol><p>The change syncs to all systems within 15 minutes.</p>`},
  {id:"KB-021", cat:"Accounts", title:"Authenticator push not arriving — use a verification code instead", views:876, helpful:71, updated:"5d ago", tickets:12,
    body:`<p>There is a known issue (PRB-0441) with push notification delivery for some users. While the vendor works on capacity, use a one-time code instead of waiting for a push.</p><h5>Switch to a code</h5><ol><li>Open the Authenticator app.</li><li>Tap your Northwind account.</li><li>Read the 6-digit one-time code and enter it at the prompt.</li></ol><p>Codes refresh every 30 seconds and work even when push is degraded. SMS fallback is also available from the sign-in screen.</p>`},
  {id:"KB-008", cat:"Devices", title:"Connect to a Northwind multifunction printer", views:1330, helpful:98, updated:"2w ago", tickets:4,
    body:`<p>Printers are published by floor and building. You do not need drivers — they install automatically.</p><h5>Windows</h5><ol><li>Open <b>Settings → Printers &amp; scanners → Add device</b>.</li><li>Search for your floor code, e.g. <code>FL2-MFP</code>.</li><li>Select the nearest device and click <b>Add</b>.</li></ol><h5>Release your print job</h5><p>All printing is <b>secure-release</b>. Tap your badge at any MFP and select <b>Print release</b>.</p>`},
  {id:"KB-030", cat:"Onboarding", title:"First-day IT checklist for new joiners", views:640, helpful:55, updated:"3w ago", tickets:2,
    body:`<h5>Before you arrive</h5><p>Your manager raises a <b>New hire onboarding</b> request. IT provisions your account, licence, and device to be ready on day one.</p><h5>Day one</h5><ol><li>Collect your laptop from the Service Desk (Building A, ground floor) and sign the asset form.</li><li>Sign in with the temporary password from your welcome email; you'll be prompted to change it and register MFA.</li><li>Install the Authenticator app and complete MFA enrolment.</li><li>Badge access activates within 2 hours of your photo being taken at Reception.</li></ol>`},
  {id:"KB-019", cat:"Email & collab", title:"Request or manage a shared mailbox", views:388, helpful:29, updated:"1mo ago", tickets:3,
    body:`<p>Shared mailboxes let a team send and receive from one address (e.g. <code>orders@</code>).</p><h5>To request one</h5><ol><li>Raise a <b>Shared mailbox / DL</b> request from the catalog.</li><li>Nominate an <b>owner</b> — they approve future membership changes.</li><li>List initial members and whether <b>Send As</b> is required.</li></ol><p>Shared mailboxes do not consume a licence up to 50 GB.</p>`},
  {id:"KB-011", cat:"Connectivity", title:"Wi-Fi keeps disconnecting — what to try first", views:1502, helpful:88, updated:"1w ago", tickets:15,
    body:`<h5>Quick checks</h5><ol><li>Forget the <code>Northwind-Corp</code> network and reconnect.</li><li>Confirm you are not on <code>Northwind-Guest</code> — guest drops every 8 hours by design.</li><li>Update your Wi-Fi adapter driver from Software Center.</li></ol><h5>Still dropping?</h5><p>Note your <b>building, floor, and the nearest AP label</b> (on the ceiling unit) and raise a ticket — this helps Network pinpoint a bad access point quickly.</p>`},
  {id:"KB-025", cat:"Security", title:"You received a suspicious email — what to do", views:990, helpful:120, updated:"2w ago", tickets:6,
    body:`<p>Do not click links or open attachments.</p><h5>Report it</h5><ol><li>Use the <b>Report Phish</b> button in Outlook (ribbon, right-hand side).</li><li>The email is removed from your mailbox and sent to Security for analysis.</li></ol><p>If you already clicked a link or entered credentials, change your password immediately at <code>passwordreset.northwind.example</code> and call the Service Desk — do not wait.</p>`},

function fmtMins(m){
  const a=Math.abs(Math.round(m));
  if(a<60) return a+"m";
  const hh=Math.floor(a/60), mm=a%60;
  if(hh<24) return mm?`${hh}h ${mm}m`:`${hh}h`;
  return `${Math.floor(hh/24)}d ${hh%24}h`;
}
function slaChip(t){
  if(!t.responded && t.status!=="Resolved" && t.status!=="Closed"){
    const m=t.respBy; const cls=m<0?"breach":m<15?"risk":"ok";
    return `<span class="sla ${cls}">${m<0?"Resp breached":"Resp "+fmtMins(m)}</span>`;
  }
  if(t.status==="Resolved"||t.status==="Closed") return `<span class="sla met">Met</span>`;
  const m=t.resBy; const p=SLA_POLICY[t.pri].res; const cls=m<0?"breach":m<Math.max(30,p*0.15)?"risk":"ok";
  return `<span class="sla ${cls}">${m<0?"Res breached":"Res "+fmtMins(m)}</span>`;
}
function statusPill(s){
  const map={"In progress":"info","Awaiting user":"warn","Awaiting approval":"warn","Awaiting fulfilment":"accent","On hold":"neutral","Resolved":"ok","Closed":"ok","New":"warn"};
  return `<span class="pill ${map[s]||"neutral"}">${s}</span>`;
}

function priChip(p){ return `<span class="pri ${p.toLowerCase()}">${p}</span>`; }
function ciStatusPill(s){ return `<span class="pill ${s==="Operational"?"ok":s==="Degraded"?"warn":"crit"}">${s}</span>`; }

function donut(segments){
  // segments: [{label,value,color}]
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  let off=0; const r=15.9155, c=2*Math.PI*r;
  const arcs=segments.map(s=>{
    const len=s.value/total*c;
    const el=`<circle cx="18" cy="18" r="${r}" fill="none" stroke="${s.color}" stroke-width="5" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 18 18)"/>`;
    off+=len; return el;
  }).join("");
  return `<div class="donut">
    <svg viewBox="0 0 36 36">${arcs}<text x="18" y="19.5" text-anchor="middle" font-size="7" font-family="var(--mono)" fill="var(--text)">${total}</text></svg>
    <div class="legend">${segments.map(s=>`<span style="--lc:${s.color}">${s.label}<b>${s.value}</b></span>`).join("")}</div>
  </div>`;
}
function bars(rows,max){
  const mx=max||Math.max(...rows.map(r=>r.v),1);
  return `<div class="bars">${rows.map(r=>`<div class="bar-row"><span class="bl">${r.l}</span><span class="bar-track"><i style="width:${r.v/mx*100}%;background:${r.c||'var(--accent)'}"></i></span><span class="bv">${r.v}</span></div>`).join("")}</div>`;
}
function sparkline(vals,color){
  const w=260,hh=40,lo=Math.min(...vals),hi=Math.max(...vals),rng=hi-lo||1,step=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*step, hh-((v-lo)/rng)*(hh-6)-3]);
  const line="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ");
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><path d="${line} L ${w} ${hh} L 0 ${hh} Z" fill="${color}" opacity=".12"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}
function tile(lab,big,sub,col){
  return `<div class="tile"><span class="lab">${lab}</span><span class="big num">${big}</span><span class="sub">${col?`<span class="tick" style="background:${col}"></span>`:""}${sub}</span></div>`;
}

        <option value="Resolved">Resolved</option>
      </select>
      <select id="q-pri"><option value="all">Any priority</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select>
      <select id="q-group"><option value="all">Any group</option>${GROUPS.map(g=>`<option>${g}</option>`).join("")}</select>
      <select id="q-assignee"><option value="all">Anyone</option><option value="${ME}">Me</option><option value="none">Unassigned</option>${AGENTS.map(a=>`<option value="${a.id}">${a.name}</option>`).join("")}</select>
      <input class="fsearch" id="q-q" placeholder="Filter subject / requester…">
      <span class="fcount" id="q-count"></span>
    </div>
    <div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>ID</th><th>Subject</th><th>Requester</th><th>Group</th><th>Assignee</th><th>Priority</th><th>Status</th><th>SLA</th><th>Updated</th></tr></thead>
      <tbody id="q-rows"></tbody>
    </table></div></div>`;
  $("#q-type").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$$("#q-type button").forEach(x=>x.setAttribute("aria-pressed",x===b));qFilter.type=b.dataset.v;paintQueue();});
  ["status","pri","group","assignee"].forEach(k=>$("#q-"+k).addEventListener("change",e=>{qFilter[k]=e.target.value;paintQueue();}));
  $("#q-q").addEventListener("input",e=>{qFilter.q=e.target.value.toLowerCase();paintQueue();});
  $("#q-status").value=qFilter.status;
  paintQueue();
}
function queueRows(){
  return TICKETS.filter(t=>{
    if(qFilter.type!=="all"&&t.type!==qFilter.type) return false;
    if(qFilter.status==="open"&&["Resolved","Closed"].includes(t.status)) return false;
    if(qFilter.status!=="open"&&qFilter.status!=="all"&&t.status!==qFilter.status) return false;
    if(qFilter.pri!=="all"&&t.pri!==qFilter.pri) return false;
    if(qFilter.group!=="all"&&t.group!==qFilter.group) return false;
    if(qFilter.assignee==="none"&&t.assignee) return false;
    if(qFilter.assignee!=="all"&&qFilter.assignee!=="none"&&t.assignee!==qFilter.assignee) return false;
    if(qFilter.q&&!(t.subject+" "+t.requester+" "+t.id).toLowerCase().includes(qFilter.q)) return false;
    return true;
  }).sort((a,b)=>({P1:0,P2:1,P3:2,P4:3}[a.pri]-{P1:0,P2:1,P3:2,P4:3}[b.pri]));
}
function paintQueue(){
  const rows=queueRows();
  $("#q-count").textContent=`${rows.length} ticket${rows.length!==1?"s":""}`;
  $("#q-rows").innerHTML=rows.map(t=>`
    <tr data-open="ticket:${t.id}">
      <td class="t-id">${t.id}${t.major?' <span class="pill crit" style="padding:1px 5px">MI</span>':''}</td>
      <td class="t-sub">${esc(t.subject)}</td>
      <td class="t-dim">${esc(t.requester)}</td>
      <td class="t-dim">${t.group}</td>
      <td>${agentCell(t.assignee)}</td>
      <td>${priChip(t.pri)}</td>
      <td>${statusPill(t.status)}</td>
      <td>${slaChip(t)}</td>
      <td class="t-mono">${t.updated}</td>
    </tr>`).join("")||`<tr><td colspan="9" class="t-dim" style="padding:20px;text-align:center">No tickets match these filters.</td></tr>`;
}

}
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); if(lastFocus)lastFocus.focus(); }

function invalidate(){ Object.keys(RENDERED).forEach(k=>RENDERED[k]=false); const a=$(".view.active")?.id; if(a&&RENDER_FN[a]){RENDER_FN[a]();RENDERED[a]=true;} buildNav(); }

scrim.addEventListener("click",closeDrawer);
drawer.addEventListener("click",e=>{
  if(e.target.closest(".dr-close")){closeDrawer();return;}
  const mode=e.target.closest("#wl-mode button");
  if(mode){$$("#wl-mode button").forEach(x=>x.setAttribute("aria-pressed",x===mode));wlMode=mode.dataset.v;return;}
  const wl=e.target.closest("[data-wl]");
  if(wl){ const inp=$("#wl-input"); const v=inp.value.trim(); if(!v)return; const t=T[wl.dataset.wl];
    t.log.push({by:ME,t:"just now",txt:v,note:wlMode==="note"}); t.updated="just now"; if(!t.responded){t.responded=true;} rerenderDrawer(); toast(wlMode==="note"?"Internal note added":"Reply sent to requester"); return; }
  const rs=e.target.closest("[data-resolve]");
  if(rs){ const t=T[rs.dataset.resolve]; t.status="Resolved"; t.resolution="Resolved by agent"; t.updated="just now"; t.major=false; t.log.push({by:ME,t:"just now",txt:"Resolved. Resolution code: Resolved by agent."}); rerenderDrawer(); invalidate(); toast(`${t.id} resolved`); return; }
  const am=e.target.closest("[data-assignme]");
  if(am){ const t=T[am.dataset.assignme]; t.assignee=ME; t.updated="just now"; rerenderDrawer(); invalidate(); toast(`${t.id} assigned to you`); return; }
  const sr=e.target.closest("[data-submitreq]");
  if(sr){ const c=CAT[sr.dataset.submitreq]; const nid="REQ-"+(SEQ.REQ++);
    const nt={id:nid,type:"request",subject:c.name+" — "+(new Date().toLocaleDateString()),requester:"Amir K. · IT",pri:"P4",status:"Awaiting approval",group:"Service Desk",assignee:null,ci:null,opened:"just now",updated:"just now",responded:false,respBy:c.sla.includes("1 ")?480:240,resBy:1440,cat:c.cat,item:c.name,desc:"Submitted via Service Catalog: "+c.name+".",log:[{by:"system",t:"just now",txt:"Request submitted via catalog. Routing for approval: "+c.approval+"."}]};
    TICKETS.push(nt); T[nid]=nt; closeDrawer(); invalidate(); toast(`${nid} raised`); return; }
  const tt=e.target.closest("[data-toast]");
  if(tt){ toast(tt.dataset.toast); return; }
  const op=e.target.closest("[data-open]");
  if(op){ const [k,i]=op.dataset.open.split(":"); openDrawer(k,i); }
});

const RENDER_FN={dashboard:renderDashboard,queue:renderQueue,incidents:renderIncidents,problems:renderProblems,changes:renderChanges,catalog:renderCatalog,knowledge:renderKnowledge,cmdb:renderCMDB,assets:renderAssets,reports:renderReports};

function show(view){
  if(!VIEWS.includes(view))return;
  $$(".view").forEach(v=>v.classList.toggle("active",v.id===view));
  $$("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"page":"false"));
  $("#view-title").textContent=TITLES[view];
  if(!RENDERED[view]){ RENDER_FN[view](); RENDERED[view]=true; }
  try{localStorage.setItem("mrd-view",view);}catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const nav=e.target.closest("#nav button");
  if(nav){show(nav.dataset.view);return;}
  const op=e.target.closest("[data-open]");
  if(op&&!e.target.closest(".drawer")){ const [k,i]=op.dataset.open.split(":"); openDrawer(k,i); }
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="Escape")closeDrawer();
  if(e.key.toLowerCase()==="t")toggleTheme();
  const n=parseInt(e.key); if(n>=1&&n<=VIEWS.length)show(VIEWS[n-1]);
});
$("#new-btn").addEventListener("click",()=>show("catalog"));
$("#gsearch").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const q=e.target.value.trim().toLowerCase(); if(!q)return;
  const t=TICKETS.find(x=>x.id.toLowerCase()===q||x.subject.toLowerCase().includes(q));
  if(t){openDrawer("ticket",t.id);return;}
  const c=CIS.find(x=>x.name.toLowerCase().includes(q)); if(c){openDrawer("ci",c.id);return;}
  const k=KB.find(x=>x.title.toLowerCase().includes(q)); if(k){openDrawer("kb",k.id);return;}
  toast("No match for “"+e.target.value+"”");
});

  const cur=root.getAttribute("data-theme"), sys=matchMedia("(prefers-color-scheme:dark)").matches;

function toast(m){ const b=$("#toasts"); const el=h(`<div class="toast">${esc(m)}</div>`); b.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .2s";},2000); setTimeout(()=>el.remove(),2300); }

// SLA countdown
setInterval(()=>{
  let dirty=false;
  TICKETS.forEach(t=>{ if(["Resolved","Closed"].includes(t.status))return;
    if(!t.responded){ t.respBy-=1; } t.resBy-=1; dirty=true; });
  if(dirty){
    const a=$(".view.active")?.id;
    if(a==="queue")paintQueue(); else if(a==="dashboard"){RENDERED.dashboard=false;renderDashboard();RENDERED.dashboard=true;}
    else if(a==="incidents"){RENDERED.incidents=false;renderIncidents();RENDERED.incidents=true;}
    if(drawer.classList.contains("open")&&drawer.dataset.kind==="ticket")rerenderDrawer();
  }
}, 60000);

/* ================= INIT ================= */
buildNav(); themeIcon();
let start="dashboard";
try{const v=localStorage.getItem("mrd-view"); if(v&&VIEWS.includes(v))start=v;}catch(e){}
show(start);
})();
</script>
