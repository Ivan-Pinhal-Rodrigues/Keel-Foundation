replicaCount: 1

image:
  repository: keel
  tag: local
  pullPolicy: IfNotPresent

# Image used by the pre-install/pre-upgrade migrate Job. Must point at an
# image built from the Dockerfile's `build` stage (full toolchain — prisma
# CLI, docker/migrate-entrypoint.sh present), never the `runner` stage used
# by `image` above, which deliberately has neither. Defaults to the same
# image as `image` so the chart still installs out-of-the-box; override
# independently at install time (see README).
migrateImage:
  repository: keel
  tag: local

existingSecret: keel-secrets

config:
  appUrl: "http://localhost:3000"
  notifyPollMs: "5000"
  notifyBatch: "20"
  logLevel: "info"

service:
  port: 3000

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

serviceAccount:
  create: true
  name: ""
